<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fff5f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }

        h2 {
            font-size: 28px;
            color: #ff6fa8;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            margin-bottom: 40px;
            color: #555;
        }

        .btn {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .simple {
            background-color: #ff8fbf;
            color: white;
        }

        .simple:hover {
            background-color: #ff6fa8;
        }

        .complex {
            background-color: #c7a6ff;
            color: white;
        }

        .complex:hover {
            background-color: #b48cff;
        }
    </style>
</head>
<body>

    <h2>Complete Your Payment</h2>
    <p>Select your nail type below to continue.</p>

    <!-- SIMPLE NAILS PAYMENT -->
    <button class="btn simple"
        onclick="window.location.href='https://buy.stripe.com/dRm8wPbbPcMmba8cWGcMM00'">
        Simple Nails – Pay £15
    </button>

    <!-- COMPLEX NAILS PAYMENT -->
    <button class="btn complex"
        onclick="window.location.href='https://buy.stripe.com/8x2fZheo1aEecece0KcMM01'">
        Complex Nails – Pay £20
    </button>

</body>
</html>
