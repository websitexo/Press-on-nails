<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- FIXES THE ZOOM ISSUE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fff5f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px; /* keeps layout tight and aesthetic */
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h2 {
            font-size: 26px;
            color: #ff6fa8;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            margin-bottom: 35px;
            color: #555;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s ease;
            margin-bottom: 15px;
        }

        .simple {
            background-color: #ff8fbf;
            color: white;
        }

        .simple:hover {
            background-color: #ff6fa8;
        }

        .complex {
            background-color: #c7a6ff;
            color: white;
        }

        .complex:hover {
            background-color: #b48cff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Complete Your Payment</h2>
        <p>Select your nail type below to continue.</p>

        <button class="btn simple"
            onclick="window.location.href='https://buy.stripe.com/dRm8wPbbPcMmba8cWGcMM00'">
            Simple Nails – Pay £15
        </button>

        <button class="btn complex"
            onclick="window.location.href='https://buy.stripe.com/8x2fZheo1aEecece0KcMM01'">
            Complex Nails – Pay £20
        </button>
    </div>
</body>
</html>
