<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }
        h2 {
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .simple {
            background-color: #ff69b4;
        }
        .simple:hover {
            background-color: #ff85c2;
        }
        .complex {
            background-color: #6a5acd;
        }
        .complex:hover {
            background-color: #7b6fe0;
        }
    </style>
</head>
<body>

    <h2>Complete Your Payment</h2>
    <p>You will be redirected to Stripe Checkout.</p>

    <!-- SIMPLE NAILS PAYMENT -->
    <button class="btn simple"
        onclick="window.location.href='https://buy.stripe.com/dRm8wPbbPcMmba8cWGcMM00'">
        Pay Now (Simple Nails)
    </button>

    <!-- COMPLEX NAILS PAYMENT -->
    <button class="btn complex"
        onclick="window.location.href='https://buy.stripe.com/8x2fZheo1aEecece0KcMM01'">
        Pay Now (Complex Nails)
    </button>

</body>
</html>
