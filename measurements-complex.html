<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail Measurements – Step 2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    background:#FFF7FA;
    font-family:'Poppins',sans-serif;
    margin:0;
    padding:0;
    color:#333;
}
header{
    background:linear-gradient(135deg,#F8C8DC,#FDE6EF);
    padding:50px 20px;
    text-align:center;
    color:white;
}
.section{
    padding:40px 8%;
}
.container{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}
label{
    font-weight:600;
    margin-top:15px;
    display:block;
}
input{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:1rem;
}
.next-btn{
    margin-top:20px;
    padding:14px;
    background:#F4AFC1;
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-size:1.1rem;
    display:block;
    text-align:center;
}
img{
    width:260px;
    border-radius:15px;
    display:block;
    margin:20px auto;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<header>
<h1>Nail Measurements</h1>
<p>Step 2: Take photos of each finger next to a coin</p>
</header>

<section class="section">
<div class="container">

<p style="text-align:center;">Use this example:</p>

<img src="IMG_2152.jpeg" alt="Measurement Example">

<!-- ⭐ FULL WORKING FORM BELOW ⭐ -->
<form onsubmit="goToPayment(); return false;">
<form onsubmit="goToPayment(); return false;">
<script>
function goToPayment() {
    window.location.href = "payment.html";
}
</script>
      enctype="multipart/form-data">

<!-- Redirect after email -->
<input type="hidden" name="_next" value="https://websitexo.github.io/thank-you.html">
<input type="hidden" name="_captcha" value="false">

<!-- Hidden fields from Step 1 -->
<input type="hidden" name="design_type" value="£20 Complex">

<input type="hidden" name="length" id="length">
<input type="hidden" name="details" id="details">
<input type="hidden" name="email" id="email">

<label>Thumb Photo</label>
<input type="file" name="thumb" accept="image/*" required>

<label>Index Finger Photo</label>
<input type="file" name="index" accept="image/*" required>

<label>Middle Finger Photo</label>
<input type="file" name="middle" accept="image/*" required>

<label>Ring Finger Photo</label>
<input type="file" name="ring" accept="image/*" required>

<label>Pinky Finger Photo</label>
<input type="file" name="pinky" accept="image/*" required>

<button class="next-btn" type="submit">Submit Measurements</button>

</form>

</div>
</section>

<script>
// Pull Step 1 data from sessionStorage
document.getElementById('length').value = sessionStorage.getItem('length');
document.getElementById('details').value = sessionStorage.getItem('details');
document.getElementById('email').value = sessionStorage.getItem('email');
</script>

</body>
</html>
