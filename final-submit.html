<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submitting Order…</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

    <h2>Submitting Your Order…</h2>
    <p>Please wait a moment.</p>

    <form id="finalForm" action="https://formsubmit.co/pressednailsxo@gmail.com" method="POST" enctype="multipart/form-data">

        <!-- Redirect to thank-you page -->
        <input type="hidden" name="_next" value="thank-you.html">

        <!-- Prevent captcha -->
        <input type="hidden" name="_captcha" value="false">

        <!-- Customer details -->
        <input type="hidden" name="customer_name" id="customer_name">
        <input type="hidden" name="customer_email" id="customer_email">
        <input type="hidden" name="nail_shape" id="nail_shape">
        <input type="hidden" name="nail_length" id="nail_length">
        <input type="hidden" name="inspo" id="inspo">

        <!-- Measurements photos -->
        <input type="file" name="photo1" id="photo1">
        <input type="file" name="photo2" id="photo2">
        <input type="file" name="photo3" id="photo3">

    </form>

    <script>
        // Load stored data from previous pages
        document.getElementById("customer_name").value = localStorage.getItem("customer_name");
        document.getElementById("customer_email").value = localStorage.getItem("customer_email");
        document.getElementById("nail_shape").value = localStorage.getItem("nail_shape");
        document.getElementById("nail_length").value = localStorage.getItem("nail_length");
        document.getElementById("inspo").value = localStorage.getItem("inspo");

        // Load stored photos
        function loadPhoto(id, key) {
            let fileData = localStorage.getItem(key);
            if (!fileData) return;

            let byteString = atob(fileData.split(',')[1]);
            let mimeString = fileData.split(',')[0].split(':')[1].split(';')[0];

            let ab = new ArrayBuffer(byteString.length);
            let ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }

            let file = new File([ab], key + ".jpg", { type: mimeString });
            let dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById(id).files = dt.files;
        }

        loadPhoto("photo1", "photo1");
        loadPhoto("photo2", "photo2");
        loadPhoto("photo3", "photo3");

        // Auto-submit the form
        document.getElementById("finalForm").submit();
    </script>

</body>
</html>
