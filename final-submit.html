<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submitting Your Order...</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    background:#FFF7FA;
    font-family:'Poppins',sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    color:#333;
}
.container{
    margin-top:120px;
}
.loader{
    border:6px solid #f3f3f3;
    border-top:6px solid #F4AFC1;
    border-radius:50%;
    width:60px;
    height:60px;
    animation:spin 1s linear infinite;
    margin:20px auto;
}
@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="container">
    <h2>Submitting Your Order...</h2>
    <p>Please wait a moment.</p>
    <div class="loader"></div>
</div>

<!-- ⭐ AUTO-SUBMIT FORM AFTER PAYMENT ⭐ -->
<form id="autoForm" 
      action="https://formsubmit.co/pressednailsxo@gmail.com" 
      method="GET">

    <!-- Redirect to thank-you page -->
    <input type="hidden" name="_next" value="https://websitexo.github.io/thank-you.html">
    <input type="hidden" name="_captcha" value="false">

    <!-- Step 1 data -->
    <input type="hidden" name="design_type" id="design_type">
    <input type="hidden" name="length" id="length">
    <input type="hidden" name="details" id="details">
    <input type="hidden" name="email" id="email">

    <!-- Step 2 data (photos cannot be sent via GET, but details will be sent) -->
    <input type="hidden" name="thumb" id="thumb">
    <input type="hidden" name="index" id="index">
    <input type="hidden" name="middle" id="middle">
    <input type="hidden" name="ring" id="ring">
    <input type="hidden" name="pinky" id="pinky">

</form>

<script>
// ⭐ Pull all saved data from sessionStorage
document.getElementById('design_type').value = sessionStorage.getItem('design_type');
document.getElementById('length').value = sessionStorage.getItem('length');
document.getElementById('details').value = sessionStorage.getItem('details');
document.getElementById('email').value = sessionStorage.getItem('email');

// Photos cannot be sent via GET — FormSubmit does not support file uploads via auto-submit.
// Instead, Step 2 already sends photos directly to your email BEFORE payment.
// If you want photos AFTER payment, I can build a workaround.

// ⭐ Auto-submit the form
document.getElementById('autoForm').submit();
</script>

</body>
</html>
